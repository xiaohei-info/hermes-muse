<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" font-family="-apple-system,'Segoe UI','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif" role="img" aria-label="Hermes Muse 工作方式">
<style>.h{fill:#59636e;font-size:12px;font-weight:600}.m{fill:#59636e;font-size:10.5px}.t{fill:#1f2328;font-size:13px;font-weight:600}.lb{fill:#59636e;font-size:10.5px}
.box{fill:#fff;stroke:#d0d7de}.wk{fill:#fff;stroke:#0969da;stroke-width:1.4}.led{fill:#fff;stroke:#656d76;stroke-width:1.2}
.panel{fill:#0969da;fill-opacity:.07;stroke:#0969da;stroke-opacity:.5;stroke-dasharray:4 3}
.w{stroke:#656d76;stroke-width:1.2;fill:none}.r{stroke:#0969da;stroke-width:1.2;fill:none;stroke-dasharray:5 3}
.nt{fill:#1f2328;font-size:12.5px;font-weight:600}.nb{fill:#59636e;font-size:11px}</style>
<defs><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#656d76"/></marker><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0969da"/></marker></defs>
<rect width="1100" height="790" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="20" y="32" font-size="18" font-weight="600" fill="#1f2328">Hermes Muse 工作方式</text><text x="20" y="52" font-size="12" fill="#59636e">中间是 Muse 的账本（state-v2.db）。左边的工人把东西写进账本，右边的读账本、交到你手上。</text>
<g transform="translate(10,64)">
<text class="h" x="10" y="18">输入</text>
<text class="h" x="200" y="18">工人（写账本）</text>
<text class="h" x="470" y="18">账本 · state-v2.db</text>
<text class="h" x="700" y="18">读账本的</text>
<text class="h" x="900" y="18">你看到的</text>
<rect class="panel" x="460" y="60" width="170" height="480" rx="10"/>
<rect class="box" x="10" y="58" width="160" height="54" rx="8"/>
<text class="t" x="20" y="77">你的每轮对话</text>
<text class="m" x="20" y="92">每轮聊完自动记录</text>
<rect class="box" x="10" y="306" width="160" height="60" rx="8"/>
<text class="t" x="20" y="325">你明确交代的事</text>
<text class="m" x="20" y="340">「出结果告诉我」</text>
<text class="m" x="20" y="353">「我关注 X」</text>
<rect class="box" x="10" y="484" width="160" height="60" rx="8"/>
<text class="t" x="20" y="503">外部来源</text>
<text class="m" x="20" y="518">邮件、日历、GitHub、</text>
<text class="m" x="20" y="531">设备状态…</text>
<rect class="wk" x="200" y="90" width="190" height="60" rx="8"/>
<text class="t" x="210" y="109">整理员 · intake</text>
<text class="m" x="210" y="124">每小时 · 接力 · 每批 15 条</text>
<text class="m" x="210" y="137">每条：存下 / 忽略 / 当背景</text>
<rect class="wk" x="200" y="160" width="190" height="134" rx="8"/>
<text class="t" x="210" y="179">夜间复盘 · nightly</text>
<text class="m" x="210" y="194">03:20 起 · 接力 · 每批 10 条</text>
<text class="m" x="210" y="207">跟进到期目标，处理</text>
<text class="m" x="210" y="220">目标提案；回看对话</text>
<text class="m" x="210" y="233">找想法和不足</text>
<rect class="wk" x="200" y="306" width="190" height="60" rx="8"/>
<text class="t" x="210" y="325">主会话当场登记</text>
<text class="m" x="210" y="340">直接记目标、兴趣、想法</text>
<text class="m" x="210" y="353">不经过工人</text>
<rect class="wk" x="200" y="378" width="190" height="92" rx="8"/>
<text class="t" x="210" y="397">Feed 研究 · feed</text>
<text class="m" x="210" y="412">每天 08:00 · 接力 · 每批 3 个</text>
<text class="m" x="210" y="425">挑兴趣上网查一轮；</text>
<text class="m" x="210" y="438">特别值得说的另起通知</text>
<rect class="wk" x="200" y="484" width="190" height="60" rx="8"/>
<text class="t" x="210" y="503">巡逻 · patrol</text>
<text class="m" x="210" y="518">每 30 分钟 · 最多 8 条</text>
<text class="m" x="210" y="531">值得打扰你才写通知</text>
<rect class="led" x="470" y="70" width="150" height="46" rx="8"/>
<text class="t" x="480" y="89">新信号</text>
<text class="m" x="480" y="104">72 小时未整理就搁置</text>
<rect class="led" x="470" y="152" width="150" height="46" rx="8"/>
<text class="t" x="480" y="171">目标</text>
<text class="m" x="480" y="186">定时任务每天最多建 5 个</text>
<rect class="led" x="470" y="212" width="150" height="46" rx="8"/>
<text class="t" x="480" y="231">想法</text>
<text class="m" x="480" y="246">14 天没人提就淡出</text>
<rect class="led" x="470" y="272" width="150" height="46" rx="8"/>
<text class="t" x="480" y="291">发现</text>
<text class="m" x="480" y="306">我哪里做得不好</text>
<rect class="led" x="470" y="350" width="150" height="46" rx="8"/>
<text class="t" x="480" y="369">兴趣</text>
<text class="m" x="480" y="384">14 天没人提就淡出</text>
<rect class="led" x="470" y="412" width="150" height="46" rx="8"/>
<text class="t" x="480" y="431">Feed 条目</text>
<text class="m" x="480" y="446">研究简报</text>
<rect class="led" x="470" y="474" width="150" height="56" rx="8"/>
<text class="t" x="480" y="493">通知</text>
<text class="m" x="480" y="508">草稿 → 排期 → 送达</text>
<text class="m" x="480" y="521">也含久无进展的询问</text>
<path class="w" d="M170,76 L470,76" marker-end="url(#aw)"/>
<path class="r" d="M90,112 V200 H200" marker-end="url(#ar)"/>
<text class="lb" x="96" y="150">回看 72 小时对话</text>
<path class="w" d="M170,336 L200,336" marker-end="url(#aw)"/>
<path class="w" d="M170,514 L200,514" marker-end="url(#aw)"/>
<path class="w" d="M390,112 L470,112" marker-end="url(#aw)"/>
<path class="r" d="M470,100 L390,100" marker-end="url(#ar)"/>
<path class="r" d="M470,172 L390,172" marker-end="url(#ar)"/>
<path class="w" d="M390,186 L470,186" marker-end="url(#aw)"/>
<path class="w" d="M390,232 L470,232" marker-end="url(#aw)"/>
<path class="w" d="M390,284 L470,284" marker-end="url(#aw)"/>
<path class="w" d="M390,360 L470,360" marker-end="url(#aw)"/>
<path class="r" d="M470,384 L390,384" marker-end="url(#ar)"/>
<path class="w" d="M390,432 L470,432" marker-end="url(#aw)"/>
<path class="w" d="M390,452 H440 V480 H470" marker-end="url(#aw)"/>
<path class="r" d="M470,496 L390,496" marker-end="url(#ar)"/>
<path class="w" d="M390,512 L470,512" marker-end="url(#aw)"/>
<path class="w" d="M295,90 V46 H995 V58" marker-end="url(#aw)"/>
<text class="lb" x="420" y="41">有用的事实 → Hermes 记忆（不在账本里）</text>
<rect class="wk" x="700" y="160" width="150" height="60" rx="8"/>
<text class="t" x="710" y="179">对话前提示</text>
<text class="m" x="710" y="194">每轮开始前读一次</text>
<text class="m" x="710" y="207">等待的目标、未处理发现</text>
<rect class="wk" x="700" y="300" width="150" height="70" rx="8"/>
<text class="t" x="710" y="319">周报 · weekly</text>
<text class="m" x="710" y="334">周日 21:15</text>
<text class="m" x="710" y="347">近 7 天各类记录</text>
<text class="m" x="710" y="360">和健康摘要</text>
<rect class="wk" x="700" y="484" width="150" height="60" rx="8"/>
<text class="t" x="710" y="503">投递员 · deliver</text>
<text class="m" x="710" y="518">每 10 分钟 · 不跑模型</text>
<text class="m" x="710" y="531">守免打扰和每日条数</text>
<path class="r" d="M620,176 L700,176" marker-end="url(#ar)"/>
<path class="r" d="M620,290 H665 V204 H700" marker-end="url(#ar)"/>
<path class="r" d="M630,335 L700,335" marker-end="url(#ar)"/>
<path class="r" d="M620,496 L700,496" marker-end="url(#ar)"/>
<text class="lb" x="630" y="490">到点的</text>
<path class="r" d="M620,435 L900,435" marker-end="url(#ar)"/>
<rect class="box" x="900" y="58" width="190" height="50" rx="8"/>
<text class="t" x="910" y="77">Hermes 记忆</text>
<text class="m" x="910" y="92">以后每轮对话都带着</text>
<rect class="box" x="900" y="160" width="190" height="60" rx="8"/>
<text class="t" x="910" y="179">每轮开头的提示</text>
<text class="m" x="910" y="194">「[Muse] 2 个目标到期…」</text>
<rect class="box" x="900" y="410" width="190" height="50" rx="8"/>
<text class="t" x="910" y="429">Dashboard 的 Feed 页</text>
<text class="m" x="910" y="444">随时翻看</text>
<rect class="box" x="900" y="480" width="190" height="64" rx="8"/>
<text class="t" x="910" y="499">Bot Chat 消息</text>
<text class="m" x="910" y="514">通知和周报</text>
<path class="w" d="M850,190 L900,190" marker-end="url(#aw)"/>
<path class="w" d="M850,350 H875 V500 H900" marker-end="url(#aw)"/>
<path class="w" d="M850,522 L900,522" marker-end="url(#aw)"/>
<text class="lb" x="858" y="516">发送</text>
<path class="w" d="M10,575 L50,575" marker-end="url(#aw)"/>
<text class="lb" x="56" y="579">写入</text>
<path class="r" d="M110,575 L150,575" marker-end="url(#ar)"/>
<text class="lb" x="156" y="579">读取</text>
<rect class="wk" x="216" y="568" width="14" height="14" rx="3"/>
<text class="lb" x="236" y="579">工人（定时任务或钩子）</text>
<rect class="led" x="400" y="568" width="14" height="14" rx="3"/>
<text class="lb" x="420" y="579">账本里的一类记录</text>
</g>
<rect class="box" x="20" y="690" width="345" height="82" rx="8"/><text class="nt" x="30" y="710">接力</text>
<text class="nb" x="30" y="728">整理员、夜间复盘、Feed 研究一次只领一批。</text>
<text class="nb" x="30" y="743">交完后若还有剩且最近有进展，</text>
<text class="nb" x="30" y="758">巡视就叫它跑下一批。</text>
<rect class="box" x="375" y="690" width="345" height="82" rx="8"/><text class="nt" x="385" y="710">管家巡视（tick）</text>
<text class="nb" x="385" y="728">不跑模型，只看账本、做登记。</text>
<text class="nb" x="385" y="743">你说完一轮话后、任何 Muse 任务</text>
<text class="nb" x="385" y="758">开工前、你安静 5 分钟后各一次。</text>
<rect class="box" x="730" y="690" width="345" height="82" rx="8"/><text class="nt" x="740" y="710">自动收尾</text>
<text class="nb" x="740" y="728">账本里每件事都有期限：信号搁置，</text>
<text class="nb" x="740" y="743">兴趣、想法、发现淡出，通知过期；</text>
<text class="nb" x="740" y="758">运行 2 小时没有结果就收尾。</text>
</svg>
